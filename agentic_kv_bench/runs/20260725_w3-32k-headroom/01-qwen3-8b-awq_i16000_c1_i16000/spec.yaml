name: w3-single-longctx-32k
description: 'Headroom experiment: same single-giant-context shape as w3, but with
  gpu_memory_utilization and max_model_len raised on the same T4 box to see how close
  we can get to the proposal''s 32k floor without new hardware.

  '
model: Qwen/Qwen3-8B-AWQ
overrides:
  data.input_distribution.min: 16000
  data.input_distribution.max: 16000
  data.input_distribution.mean: 16000
prediction:
  kv_dtype: float16
  gpu_mem_util: 0.75
  weights_gb: 6.0
  expect_eviction: auto
telemetry:
  scrape_vllm_metrics: true
  scrape_interval_s: 10
  lmcache_port: 6999
  lmcache_endpoints:
  - /metrics
  - /stats
  - /cache/stats
  - /health
amoprof: {}
timeouts:
  run_timeout_s: 1800
  amoprof_ready_s: 90
  post_start_settle_s: 10
  post_stop_settle_s: 10
  amoprof_stop_grace_s: 45
  workload_kill_grace_s: 20
