    path: /opt/ls/agentic_kv_bench/runs/20260725_w3-single-longctx-sweep/01-qwen3-8b-awq_w3-single-longctx_c1_i10000/report
data:
  type: random
  input_distribution:
    type: fixed
    min: 10000
    max: 10000
    mean: 10000
    std_dev: 1
    total_count: 2
  output_distribution:
    type: fixed
    min: 256
    max: 256
    mean: 256
    std_dev: 1
    total_count: 32
load:
  type: concurrent
  stages:
  - num_requests: 4
    concurrency_level: 1
