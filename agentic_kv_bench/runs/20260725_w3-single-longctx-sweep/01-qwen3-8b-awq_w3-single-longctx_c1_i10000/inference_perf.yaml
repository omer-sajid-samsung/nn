    per_stage: true
    per_request: true
    percentiles:
    - 1
    - 5
    - 10
    - 25
    - 50
    - 75
    - 90
    - 95
    - 99
  session_lifecycle:
    summary: true
    per_stage: true
    per_session: false
storage:
