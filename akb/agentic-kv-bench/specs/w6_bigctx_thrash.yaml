# =============================================================================
# W6 — Big-context revisit thrash: force real eviction/SSD reads AT the
# raised context length (proposal item D + the core "SSD" story combined).
#
# w3-32k-headroom proved this box can run 32k-context requests cleanly, but
# every cell there stayed IN_REGIME (pressure <=55%) because it was a single
# session, not a bounded-pool revisit pattern. This spec reuses w2's thrash
# mechanism (bounded unique-prompt pool > GPU pool, sampled repeatedly) but at
# ~20k tokens/prompt instead of w2's 6k, using the same raised
# gpu_memory_utilization=0.75 pool (234,640 tokens) so we can actually observe
# eviction + LMCache disk retrieval at large context, not just "it boots".
# =============================================================================
name: w6-bigctx-thrash
description: >
  Revisit thrash at large (~20k token) context: bounded unique-prompt pool
  exceeding the raised GPU KV pool, forcing eviction + LMCache disk retrieval
  at context lengths close to the proposal's 32k floor.
model: Qwen/Qwen3-8B-AWQ

inference_perf:
  data:
    type: random
    input_distribution:
      type: fixed
      min: 20000
      max: 20000
      mean: 20000
      std_dev: 1
      total_count: 16         # unique prompts -- the eviction knob
    output_distribution:
      type: fixed
      min: 256
      max: 256
      mean: 256
      std_dev: 1
      total_count: 500
  load:
    type: concurrent
    stages:
      - num_requests: 64      # >> total_count, so prompts ARE revisited
        concurrency_level: 8

run_knobs:
  c: load.stages.0.concurrency_level
  i: data.input_distribution.mean
  u: data.input_distribution.total_count

prediction:
  kv_dtype: float16
  gpu_mem_util: 0.75
  weights_gb: 6.0
  expect_eviction: auto

telemetry:
  scrape_vllm_metrics: true
  scrape_interval_s: 15
  lmcache_port: 6999
  lmcache_endpoints: [/metrics, /stats, /cache/stats, /health]

amoprof: {}

timeouts:
  run_timeout_s: 3600
  amoprof_ready_s: 90
  post_start_settle_s: 10
  post_stop_settle_s: 10
  amoprof_stop_grace_s: 45
  workload_kill_grace_s: 20

vllm_launch:
  dtype: float16
  max_model_len: 32768
  gpu_memory_utilization: 0.75
  tensor_parallel_size: 4
  enforce_eager: true
  kv_transfer_config: {kv_connector: LMCacheConnectorV1, kv_role: kv_both}
  env:
    LMCACHE_CONFIG_FILE: /opt/ls/vllm/lmcache_disk_config.yaml
    LMCACHE_INTERNAL_API_SERVER_ENABLED: "true"
